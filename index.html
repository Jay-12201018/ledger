<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F6F8">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="个人账本">
  <meta name="description" content="记每天开销，看懂钱花在哪。数据只存在这台手机上。">
  <title>个人账本</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="root">
    <div class="boot">
      <div class="boot-logo">账</div>
      <p>个人账本</p>
    </div>
  </div>
  <input type="file" id="import-file" hidden accept=".csv,.xlsx,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
  <input type="file" id="restore-file" hidden accept=".json,application/json">
  <noscript><p class="boot">请开启 JavaScript 后再使用个人账本。</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
